<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="/image/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Sriracha&display=swap');
    </style>
    <style>
       body { font-family: 'Caveat', 'Sriracha'; }
    </style>
    <script type="module" src="quiz.js"></script>
    <link rel="stylesheet" href="output.css">
</head>
<body class="overflow-hidden bg-[url('../src/sprites/bg1.png')] bg-no-repeat bg-cover bg-center h-screen">
 <style>
       #overlay {
      position: fixed !important;
      background-color: #00000050;
      z-index: 9999;
      width: 100%;
      height: 100%; }

    #loadsc {
      position: fixed !important;
      background-color: #efe1c2;
      z-index: 9999;
      width: 100%;
      height: 100%; }
   
    #loader {
      width: 48px;
      height: 48px;
      border: 5px solid #4f8fb1;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 3s linear infinite;
    }

    @keyframes rotation {
    0% {
        transform: rotate(0deg);
    }
    100% {
        transform: rotate(360deg);
    }
    } 

 </style>
   <div id="loadsc" style="display:block;">
  <div class="w-[50%] h-[40%]"></div>
  <span id="loader" class="ml-[50%] mr-[50%]"></span>
</div>
   </div>

   <div id="overlay" style="display: none;">
         <div class="h-[15%]"></div>
         <div class="w-[50%] h-[40%] m-auto" id="popup"></div>
         <div class="w-[50%] h-[10%]"></div><div class="w-[90%] h-[25%] m-auto flex flex-row px-70 justify-between">
           <div id="exit" class="w-[40%] h-full bg-[url('../src/sprites/qw.png')] bg-no-repeat bg-center bg-cover"></div>
           <div id="restart" class="w-[40%] h-full bg-[url('../src/sprites/qw.png')] bg-no-repeat bg-cover"></div>
         </div>
   </div>

   <audio id="bgm" src="../src/audi/bubble.mp3" autoplay loop></audio>
   <audio id="sfx" style="display: none;"></audio>
   <div id="quiz_Question" class="m-auto w-[40%] h-[25%] z-9999 bg-[url('../src/sprites/qq.png')] bg-no-repeat bg-center bg-cover"></div>
   <div id="gameCanvas" class="fixed ml-17 mt-9 w-[90%] h-[55%] -z-1">
        <div class="flex flex-row justify-between w-auto h-full">
            <div class="w-[40%] h-full mt-1.5 flex flex-col">
                     <div id="streak" class="w-auto h-[20%] m-1.5 flex flex-row">
                        <div id="streak-0" class="bg-[url('../src/sprites/stof.png')] bg-no-repeat bg-center bg-cover h-auto w-[15%]"></div>
                        <div id="streak-1" class="bg-[url('../src/sprites/stof.png')] bg-no-repeat bg-center bg-cover h-auto w-[15%]"></div>
                        <div id="streak-2" class="bg-[url('../src/sprites/stof.png')] bg-no-repeat bg-center bg-cover h-auto w-[15%]"></div>
                        <div id="streak-3" class="bg-[url('../src/sprites/stof.png')] bg-no-repeat bg-center bg-cover h-auto w-[15%]"></div>
                        <div id="streak-4" class="bg-[url('../src/sprites/stof.png')] bg-no-repeat bg-center bg-cover h-auto w-[15%]"></div>
                     </div>
                     <div id="ch" class="w-[55%] h-[60%] m-1.5 bg-[url('../src/sprites/ig_1.png')] bg-no-repeat bg-center bg-cover"></div>
            </div>            
            <div class="w-[40%] h-full l-0 flex flex-col">
                  <div id="hpBarCanvas" class="w-[70%] h-[10%] m-1.5"></div>
                  <div id="en" class="w-[70%] h-full m-1.5 bg-[url('../src/sprites/e1.png')] bg-no-repeat bg-center bg-cover"></div>
            </div>
        </div>
   </div>

 
   
   <div class="w-[20%] h-[10%] mt-80"></div>
   <div class="w-full h-[15%] mt-5 flex flex-row px-70 justify-between z-9999" id="butn" style="display: block;">
      <div id="quiz_T" class="w-[30%] h-full bg-[url('../src/sprites/qw.png')] bg-no-repeat bg-center bg-cover"></div>
      <div id="quiz_F" class="w-[30%] h-full bg-[url('../src/sprites/qw.png')] bg-no-repeat bg-center bg-cover"></div>
   </div>
</body>
</html>
